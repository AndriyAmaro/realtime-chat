<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" fill="none">

  <!-- Background -->
  <rect width="700" height="480" rx="12" fill="#0d1117" />

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2">AUTHENTICATION FLOW</text>

  <!-- Column headers -->
  <text x="200" y="52" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">CLIENT</text>
  <text x="500" y="52" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">SERVER</text>

  <!-- Lifelines -->
  <line x1="200" y1="62" x2="200" y2="468" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="500" y1="62" x2="500" y2="468" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ═══ LOGIN SECTION ═══ -->
  <rect x="30" y="68" width="640" height="168" rx="8" fill="#111827" stroke="#6366f1" stroke-width="1" />
  <text x="50" y="88" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LOGIN</text>

  <!-- Request arrow -->
  <line x1="200" y1="105" x2="490" y2="105" stroke="#6366f1" stroke-width="1.5" />
  <polygon fill="#6366f1" points="492,105 486,101 486,109" />
  <text x="345" y="99" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">POST /auth/login { email, password }</text>

  <!-- Server processing -->
  <rect x="440" y="115" width="120" height="42" rx="5" fill="#1a1a2e" stroke="#0d9488" stroke-width="1" />
  <text x="500" y="132" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">bcrypt.compare()</text>
  <text x="500" y="148" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">generateTokens()</text>

  <!-- Response arrow -->
  <line x1="490" y1="170" x2="210" y2="170" stroke="#14b8a6" stroke-width="1.5" />
  <polygon fill="#14b8a6" points="208,170 214,166 214,174" />
  <text x="345" y="164" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">200 { user, accessToken } + Set-Cookie: refresh_token</text>

  <!-- Client stores -->
  <rect x="110" y="182" width="180" height="26" rx="5" fill="#1a1a2e" stroke="#818cf8" stroke-width="1" />
  <text x="200" y="199" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Zustand: auth.setAuth(user, token)</text>

  <!-- Divider label -->
  <rect x="280" y="215" width="140" height="20" rx="10" fill="#1e293b" />
  <text x="350" y="228" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">AUTHENTICATED REQUEST</text>

  <!-- ═══ AUTHENTICATED REQUEST ═══ -->
  <rect x="30" y="242" width="640" height="80" rx="8" fill="#111827" stroke="#14b8a6" stroke-width="1" />
  <text x="50" y="262" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PROTECTED ROUTE</text>

  <!-- Request -->
  <line x1="200" y1="278" x2="490" y2="278" stroke="#6366f1" stroke-width="1.5" />
  <polygon fill="#6366f1" points="492,278 486,274 486,282" />
  <text x="345" y="272" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">GET /auth/me · Authorization: Bearer {token}</text>

  <!-- Response -->
  <line x1="490" y1="298" x2="210" y2="298" stroke="#14b8a6" stroke-width="1.5" />
  <polygon fill="#14b8a6" points="208,298 214,294 214,302" />
  <text x="345" y="292" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">jwt.verify() → 200 { user }</text>

  <!-- Divider label -->
  <rect x="280" y="330" width="140" height="20" rx="10" fill="#1e293b" />
  <text x="350" y="343" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">TOKEN REFRESH (AUTO)</text>

  <!-- ═══ TOKEN REFRESH ═══ -->
  <rect x="30" y="358" width="640" height="110" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1" />
  <text x="50" y="378" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AUTO REFRESH</text>

  <!-- 401 response -->
  <line x1="490" y1="395" x2="210" y2="395" stroke="#ef4444" stroke-width="1.5" />
  <polygon fill="#ef4444" points="208,395 214,391 214,399" />
  <text x="345" y="389" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">GET /auth/me → 401 Unauthorized</text>

  <!-- Refresh request -->
  <line x1="200" y1="418" x2="490" y2="418" stroke="#f59e0b" stroke-width="1.5" />
  <polygon fill="#f59e0b" points="492,418 486,414 486,422" />
  <text x="345" y="412" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">POST /auth/refresh-token · Cookie: refresh_token</text>

  <!-- New tokens response -->
  <line x1="490" y1="440" x2="210" y2="440" stroke="#14b8a6" stroke-width="1.5" />
  <polygon fill="#14b8a6" points="208,440 214,436 214,444" />
  <text x="345" y="434" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">200 { accessToken } + Set-Cookie: new refresh_token</text>

  <!-- Retry -->
  <line x1="200" y1="456" x2="490" y2="456" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4" />
  <polygon fill="#6366f1" points="492,456 486,452 486,460" />
  <text x="345" y="450" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Retry original request with new token</text>

</svg>
