<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" fill="none">

  <!-- Background -->
  <rect width="700" height="400" rx="12" fill="#0d1117" />

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2">E2E ENCRYPTION · HOW IT WOULD WORK</text>

  <!-- Column headers -->
  <rect x="50" y="42" width="160" height="30" rx="6" fill="#111827" stroke="#6366f1" stroke-width="1.5" />
  <text x="130" y="62" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">USER A (Browser)</text>

  <rect x="270" y="42" width="160" height="30" rx="6" fill="#111827" stroke="#14b8a6" stroke-width="1.5" />
  <text x="350" y="62" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">SERVER (Express)</text>

  <rect x="490" y="42" width="160" height="30" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
  <text x="570" y="62" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">USER B (Browser)</text>

  <!-- Lifelines -->
  <line x1="130" y1="76" x2="130" y2="380" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="350" y1="76" x2="350" y2="380" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="570" y1="76" x2="570" y2="380" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Step 1: Generate key pairs -->
  <rect x="55" y="86" width="150" height="36" rx="5" fill="#1a1a2e" stroke="#818cf8" stroke-width="1" />
  <text x="130" y="101" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">1. Generate key pair</text>
  <text x="130" y="114" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">ECDH P-256 (private local)</text>

  <rect x="495" y="86" width="150" height="36" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
  <text x="570" y="101" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">1. Generate key pair</text>
  <text x="570" y="114" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">ECDH P-256 (private local)</text>

  <!-- Step 2: Exchange public keys via server -->
  <line x1="130" y1="138" x2="340" y2="138" stroke="#6366f1" stroke-width="1.5" />
  <polygon fill="#6366f1" points="342,138 336,134 336,142" />
  <text x="235" y="132" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">2. Send public key</text>

  <line x1="360" y1="148" x2="570" y2="148" stroke="#14b8a6" stroke-width="1.5" />
  <polygon fill="#14b8a6" points="570,148 564,144 564,152" />
  <text x="465" y="142" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Relay A's public key</text>

  <line x1="570" y1="162" x2="360" y2="162" stroke="#f59e0b" stroke-width="1.5" />
  <polygon fill="#f59e0b" points="358,162 364,158 364,166" />
  <text x="465" y="156" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">2. Send public key</text>

  <line x1="340" y1="172" x2="130" y2="172" stroke="#14b8a6" stroke-width="1.5" />
  <polygon fill="#14b8a6" points="128,172 134,168 134,176" />
  <text x="235" y="166" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Relay B's public key</text>

  <!-- Step 3: Derive shared secret -->
  <rect x="55" y="190" width="150" height="36" rx="5" fill="#1a1a2e" stroke="#818cf8" stroke-width="1" />
  <text x="130" y="205" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">3. Derive shared secret</text>
  <text x="130" y="218" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">A.priv + B.pub = secret</text>

  <rect x="495" y="190" width="150" height="36" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
  <text x="570" y="205" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">3. Derive shared secret</text>
  <text x="570" y="218" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">B.priv + A.pub = secret</text>

  <!-- Step 4: Encrypt message -->
  <rect x="55" y="240" width="150" height="36" rx="5" fill="#1a1a2e" stroke="#818cf8" stroke-width="1" />
  <text x="130" y="255" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">4. Encrypt (AES-GCM)</text>
  <text x="130" y="268" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">"Hello" → "U2FsdGVk..."</text>

  <!-- Send encrypted to server -->
  <line x1="130" y1="290" x2="340" y2="290" stroke="#6366f1" stroke-width="1.5" />
  <polygon fill="#6366f1" points="342,290 336,286 336,294" />
  <text x="235" y="284" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Encrypted payload</text>

  <!-- Server sees only ciphertext -->
  <rect x="280" y="300" width="140" height="30" rx="5" fill="#1a1a2e" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" />
  <text x="350" y="313" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Server sees ONLY</text>
  <text x="350" y="325" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">"U2FsdGVkX1+7x9z3Kp..."</text>

  <!-- Forward to B -->
  <line x1="360" y1="340" x2="560" y2="340" stroke="#14b8a6" stroke-width="1.5" />
  <polygon fill="#14b8a6" points="562,340 556,336 556,344" />
  <text x="460" y="334" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Forward ciphertext</text>

  <!-- Step 5: Decrypt -->
  <rect x="495" y="350" width="150" height="36" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
  <text x="570" y="365" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">5. Decrypt (AES-GCM)</text>
  <text x="570" y="378" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">"U2FsdGVk..." → "Hello"</text>

</svg>
