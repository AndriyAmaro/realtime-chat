  <text x="105" y="432" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Route to services</text>
  <text x="105" y="444" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Auth · Chat · Notify</text>

  <path d="M165,426 L195,426" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="197,426 191,422 191,430" />

  <rect x="200" y="400" width="100" height="52" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
  <text x="250" y="418" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">BullMQ</text>
  <text x="250" y="432" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Message Queue</text>
  <text x="250" y="444" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Async jobs</text>

  <path d="M300,426 L330,426" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="332,426 326,422 326,430" />

  <rect x="335" y="400" width="100" height="52" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
  <text x="385" y="418" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Workers</text>
  <text x="385" y="432" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Email · Push</text>
  <text x="385" y="444" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Analytics · Thumbs</text>

  <path d="M435,426 L465,426" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="467,426 461,422 461,430" />

  <rect x="470" y="400" width="100" height="52" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
  <text x="520" y="418" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">DB Partitions</text>
  <text x="520" y="432" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Messages by month</text>
  <text x="520" y="444" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">S3/R2 for uploads</text>

  <rect x="580" y="400" width="80" height="52" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
  <text x="620" y="418" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">CDN</text>
  <text x="620" y="432" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">CloudFront</text>
  <text x="620" y="444" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">Edge cache</text>

</svg>
