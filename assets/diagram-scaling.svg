  <path d="M415,304 L445,304" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="447,304 441,300 441,308" />

  <rect x="450" y="280" width="90" height="48" rx="5" fill="#1a1a2e" stroke="#0d9488" stroke-width="1" />
  <text x="495" y="299" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">PgBouncer</text>
  <text x="495" y="313" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Connection pool</text>

  <path d="M540,304 L560,304" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="562,304 556,300 556,308" />

  <rect x="565" y="276" width="90" height="56" rx="5" fill="#1a1a2e" stroke="#06b6d4" stroke-width="1" />
  <text x="610" y="296" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">PostgreSQL</text>
  <text x="610" y="310" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Primary</text>
  <text x="610" y="324" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">+ Read Replica</text>

  <!-- Arrow down -->
  <path d="M350,344 L350,362" stroke="#475569" stroke-width="1.5" fill="none" />
  <polygon fill="#475569" points="350,365 346,359 354,359" />

