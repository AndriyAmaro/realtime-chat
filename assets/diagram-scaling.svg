  <rect x="45" y="276" width="90" height="56" rx="5" fill="#1a1a2e" stroke="#0d9488" stroke-width="1" />
  <text x="90" y="296" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Load</text>
  <text x="90" y="310" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Balancer</text>
  <text x="90" y="324" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">sticky sessions</text>

  <!-- Servers -->
  <path d="M135,290 L167,280" stroke="#475569" stroke-width="1" />
  <path d="M135,304 L167,304" stroke="#475569" stroke-width="1" />
  <path d="M135,318 L167,328" stroke="#475569" stroke-width="1" />

  <rect x="170" y="272" width="80" height="22" rx="4" fill="#1a1a2e" stroke="#0d9488" stroke-width="1" />
  <text x="210" y="287" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Server 1</text>

  <rect x="170" y="296" width="80" height="22" rx="4" fill="#1a1a2e" stroke="#0d9488" stroke-width="1" />
  <text x="210" y="311" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Server 2</text>

  <rect x="170" y="320" width="80" height="22" rx="4" fill="#1a1a2e" stroke="#0d9488" stroke-width="1" />
  <text x="210" y="335" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600">Server 3</text>

  <!-- Redis Adapter -->
  <path d="M250,304 L290,304" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="292,304 286,300 286,308" />

  <rect x="295" y="280" width="120" height="48" rx="5" fill="#1a1a2e" stroke="#ef4444" stroke-width="1" />
  <text x="355" y="299" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Redis Cluster</text>
  <text x="355" y="313" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Socket.io Adapter</text>
  <text x="355" y="324" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="7">cross-server broadcast</text>

