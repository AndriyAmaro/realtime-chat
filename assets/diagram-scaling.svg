  <rect x="30" y="244" width="640" height="100" rx="8" fill="#111827" stroke="#14b8a6" stroke-width="1.5" />
  <text x="50" y="264" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TIER 2</text>
  <text x="110" y="264" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="9">5K-50K users · ~$100-200/month</text>

