<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" fill="none">

  <!-- Background -->
  <rect width="700" height="480" rx="12" fill="#0d1117" />

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2">SCALING STRATEGY · MVP TO 100K+ USERS</text>

  <!-- ═══ TIER 0: MVP ═══ -->
  <rect x="30" y="44" width="640" height="70" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.5" />
  <text x="50" y="64" fill="#4ade80" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MVP</text>
  <text x="95" y="64" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="9">up to 500 users · ~$10/month</text>

  <rect x="45" y="76" width="120" height="28" rx="5" fill="#1a1a2e" stroke="#16a34a" stroke-width="1" />
  <text x="105" y="94" text-anchor="middle" fill="#86efac" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Vercel (CDN)</text>

  <path d="M165,90 L195,90" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="197,90 191,86 191,94" />

  <rect x="200" y="76" width="170" height="28" rx="5" fill="#1a1a2e" stroke="#16a34a" stroke-width="1" />
  <text x="285" y="94" text-anchor="middle" fill="#86efac" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">1x Express + Socket.io</text>

  <path d="M370,90 L400,90" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="402,90 396,86 396,94" />

  <rect x="405" y="76" width="140" height="28" rx="5" fill="#1a1a2e" stroke="#16a34a" stroke-width="1" />
  <text x="475" y="94" text-anchor="middle" fill="#86efac" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">PostgreSQL (1 instance)</text>

  <!-- Arrow down -->
  <path d="M350,114 L350,132" stroke="#475569" stroke-width="1.5" fill="none" />
  <polygon fill="#475569" points="350,135 346,129 354,129" />

  <!-- ═══ TIER 1: Redis ═══ -->
  <rect x="30" y="138" width="640" height="82" rx="8" fill="#111827" stroke="#6366f1" stroke-width="1.5" />
  <text x="50" y="158" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TIER 1</text>
  <text x="110" y="158" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="9">1K-5K users · ~$25/month</text>

  <rect x="45" y="168" width="180" height="40" rx="5" fill="#1a1a2e" stroke="#818cf8" stroke-width="1" />
  <text x="135" y="185" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">1x Express + Socket.io</text>
  <text x="135" y="200" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">+ shared rate limiting</text>

  <path d="M225,190 L265,190" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="267,190 261,186 261,194" />

  <rect x="270" y="168" width="180" height="40" rx="5" fill="#1a1a2e" stroke="#ef4444" stroke-width="1" />
  <text x="360" y="185" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Redis (NEW)</text>
  <text x="360" y="200" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Cache · Online Status · Pub/Sub</text>

  <path d="M450,190 L490,190" stroke="#475569" stroke-width="1" />
  <polygon fill="#475569" points="492,190 486,186 486,194" />

  <rect x="495" y="168" width="160" height="40" rx="5" fill="#1a1a2e" stroke="#818cf8" stroke-width="1" />
  <text x="575" y="185" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">PostgreSQL</text>
  <text x="575" y="200" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">60-80% less DB load</text>

  <!-- Arrow down -->
  <path d="M350,220 L350,238" stroke="#475569" stroke-width="1.5" fill="none" />
  <polygon fill="#475569" points="350,241 346,235 354,235" />

