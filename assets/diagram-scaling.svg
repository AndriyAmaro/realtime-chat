  <text x="50" y="388" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TIER 3</text>
  <text x="110" y="388" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="9">50K-100K+ users · ~$500-1000/month</text>

  <rect x="45" y="400" width="120" height="52" rx="5" fill="#1a1a2e" stroke="#d97706" stroke-width="1" />
