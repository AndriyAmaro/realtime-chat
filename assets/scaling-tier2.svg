<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" fill="none">
  <rect width="700" height="180" rx="10" fill="#0d1117" />

  <!-- Load Balancer -->
  <rect x="20" y="40" width="100" height="100" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
  <text x="70" y="72" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">Load</text>
  <text x="70" y="88" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">Balancer</text>
  <text x="70" y="106" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Sticky sessions</text>
  <text x="70" y="118" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">WebSocket aware</text>

  <!-- Arrows to servers -->
  <path d="M120,60 L175,35" stroke="#475569" stroke-width="1" />
  <path d="M120,90 L175,90" stroke="#475569" stroke-width="1.5" />
  <path d="M120,120 L175,145" stroke="#475569" stroke-width="1" />

  <!-- Servers -->
  <rect x="178" y="18" width="110" height="36" rx="6" fill="#111827" stroke="#14b8a6" stroke-width="1.5" />
  <text x="233" y="41" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">Server 1</text>

  <rect x="178" y="72" width="110" height="36" rx="6" fill="#111827" stroke="#14b8a6" stroke-width="1.5" />
  <text x="233" y="95" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">Server 2</text>

  <rect x="178" y="126" width="110" height="36" rx="6" fill="#111827" stroke="#14b8a6" stroke-width="1.5" />
  <text x="233" y="149" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">Server 3</text>

  <!-- Arrows from servers -->
  <path d="M288,36 L328,60" stroke="#475569" stroke-width="1" />
  <path d="M288,90 L328,90" stroke="#475569" stroke-width="1.5" />
  <polygon fill="#475569" points="330,90 324,86 324,94" />
  <path d="M288,144 L328,120" stroke="#475569" stroke-width="1" />

  <!-- Redis Cluster -->
  <rect x="332" y="55" width="130" height="70" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5" />
  <text x="397" y="78" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">Redis Cluster</text>
  <text x="397" y="94" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Socket.io Adapter</text>
  <text x="397" y="108" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="8">Cross-server broadcast</text>

  <!-- Arrow to DB -->
  <path d="M462,90 L498,90" stroke="#475569" stroke-width="1.5" />
  <polygon fill="#475569" points="500,90 494,86 494,94" />

  <!-- PgBouncer + PostgreSQL -->
  <rect x="502" y="30" width="170" height="120" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
  <text x="587" y="54" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">PostgreSQL</text>

  <rect x="515" y="62" width="145" height="28" rx="5" fill="#1a1a2e" stroke="#0891b2" stroke-width="1" />
  <text x="587" y="80" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">PgBouncer (pool of 20)</text>

  <rect x="515" y="96" width="68" height="28" rx="5" fill="#1a1a2e" stroke="#0891b2" stroke-width="1" />
  <text x="549" y="114" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Primary</text>

  <rect x="591" y="96" width="68" height="28" rx="5" fill="#1a1a2e" stroke="#0891b2" stroke-width="1" />
  <text x="625" y="114" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">Replica</text>
</svg>
